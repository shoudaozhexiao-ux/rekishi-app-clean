<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<script>
(() => {
  let lastYear;
  function send(type, data) {
    window.parent.postMessage({isStreamlitMessage: true, type, ...data}, "*");
  }
  function updateYear() {
    const year = new Date().getFullYear();
    if (year !== lastYear) {
      lastYear = year;
      send("streamlit:setComponentValue", {value: year, dataType: "json"});
    }
  }
  window.addEventListener("message", event => {
    if (event.source === window.parent && event.data?.type === "streamlit:render") {
      send("streamlit:setFrameHeight", {height: 0});
      updateYear();
    }
  });
  document.addEventListener("visibilitychange", updateYear);
  window.addEventListener("focus", updateYear);
  setInterval(updateYear, 60000);
  send("streamlit:componentReady", {apiVersion: 1});
})();
</script>
</html>
